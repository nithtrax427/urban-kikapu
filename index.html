<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Urban Kikapu | Sneakers, Fashion & Home Essentials</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <!-- Header -->
  <header class="navbar">
    <div class="container nav-content">
      <a href="#" class="logo">Urban<span>Kikapu</span> 🧺</a>
      <div class="search-bar">
        <input type="text" id="searchInput" placeholder="Search sneakers, utensils, mats, clothes..." />
      </div>
      <button class="cart-btn" id="openCartBtn">
        Cart (<span id="cartCount">0</span>)
      </button>
    </div>
  </header>

  <!-- Hero Banner -->
  <section class="hero">
    <div class="container">
      <h1>Everything From Your Kitchen to Your Closet</h1>
      <p>Fresh sneakers, everyday wear, kitchen utensils, and home mats delivered fast. Pay easily via M-PESA.</p>
      <a href="#catalog" class="btn-primary">Shop Latest Arrivals</a>
    </div>
  </section>

  <!-- Category Filters -->
  <main class="container" id="catalog">
    <div class="filter-bar">
      <button class="filter-btn active" data-category="all">All Items</button>
      <button class="filter-btn" data-category="sneakers">Sneakers</button>
      <button class="filter-btn" data-category="clothing">Clothing</button>
      <button class="filter-btn" data-category="kitchen">Kitchen Utensils</button>
      <button class="filter-btn" data-category="home">Home & Mats</button>
    </div>

    <!-- Product Grid -->
    <div class="product-grid" id="productGrid"></div>
  </main>

  <!-- Slide-out Cart Drawer -->
  <div class="cart-overlay" id="cartOverlay"></div>
  <aside class="cart-drawer" id="cartDrawer">
    <div class="cart-header">
      <h2>Your Kikapu 🧺</h2>
      <button class="close-btn" id="closeCartBtn">&times;</button>
    </div>

    <div class="cart-items" id="cartItems"></div>

    <div class="cart-footer">
      <div class="cart-total">
        <span>Total:</span>
        <strong>KES <span id="cartTotal">0</span></strong>
      </div>

      <!-- Checkout Inputs -->
      <div class="checkout-form">
        <input type="text" id="customerName" placeholder="Your Full Name" required />
        <input type="text" id="customerLocation" placeholder="Delivery Town / Estate" required />
        <input type="tel" id="mpesaPhone" placeholder="M-PESA Number (e.g. 0712345678)" required />
        <button class="btn-mpesa" id="mpesaCheckoutBtn">Pay with M-PESA Express</button>
        <button class="btn-whatsapp" id="whatsappCheckoutBtn">Order via WhatsApp</button>
      </div>
    </div>
  </aside>

  <!-- Footer -->
  <footer class="footer">
    <div class="container">
      <p>&copy; 2026 Urban Kikapu. All rights reserved. Fast countrywide delivery.</p>
    </div>
  </footer>

  <script src="app.js"></script>
</body>
</html>
